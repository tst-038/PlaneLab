services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    entrypoint: ["/bin/sh", "/config/start.sh"]
    hostname: ${TAILSCALE_HOSTNAME:-planelab}
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-planelab}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # start.sh applies and advertises the Services config explicitly. The
      # containerboot TS_SERVE_CONFIG path currently parses a legacy format.
      TS_EXPERIMENTAL_SERVICE_AUTO_ADVERTISEMENT: "false"
    volumes:
      - tailscale_state:/var/lib/tailscale
      # Includes the service configuration and startup wrapper.
      - ./tailscale:/config:ro

volumes:
  tailscale_state:
    name: planelab_tailscale_state
    external: true
