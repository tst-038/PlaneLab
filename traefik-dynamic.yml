http:
  routers:
    jellyfin:
      rule: Host(`jellyfin.planelab`)
      entryPoints: [web]
      service: jellyfin
    seerr:
      rule: Host(`seerr.planelab`)
      entryPoints: [web]
      service: seerr
    sonarr:
      rule: Host(`sonarr.planelab`)
      entryPoints: [web]
      service: sonarr
    radarr:
      rule: Host(`radarr.planelab`)
      entryPoints: [web]
      service: radarr
    prowlarr:
      rule: Host(`prowlarr.planelab`)
      entryPoints: [web]
      service: prowlarr
    sabnzbd:
      rule: Host(`sabnzbd.planelab`)
      entryPoints: [web]
      service: sabnzbd
    rdtclient:
      rule: Host(`rdtclient.planelab`)
      entryPoints: [web]
      service: rdtclient
    youtarr:
      rule: Host(`youtarr.planelab`)
      entryPoints: [web]
      service: youtarr

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: http://jellyfin:8096
    seerr:
      loadBalancer:
        servers:
          - url: http://seerr:5055
    sonarr:
      loadBalancer:
        servers:
          - url: http://sonarr:8989
    radarr:
      loadBalancer:
        servers:
          - url: http://radarr:7878
    prowlarr:
      loadBalancer:
        servers:
          - url: http://prowlarr:9696
    sabnzbd:
      loadBalancer:
        servers:
          - url: http://sabnzbd:8080
    rdtclient:
      loadBalancer:
        servers:
          - url: http://rdtclient:6500
    youtarr:
      loadBalancer:
        servers:
          - url: http://youtarr:3011
